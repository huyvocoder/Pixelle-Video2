<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="template:media-width" content="1920">
    <meta name="template:media-height" content="1080">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Image Only - 1920x1080</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
        }

        body {
            font-family: 'Be Vietnam Pro', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #fff;
            position: relative;
            background: transparent;
            background-image: url("{{image}}");
            background-size: cover;
            background-position: center;
        }

        .main {
            width: 100%;
            height: 1080px;
        }
    </style>
</head>

<body>
    <div class="main">
    </div>
</body>

</html>
